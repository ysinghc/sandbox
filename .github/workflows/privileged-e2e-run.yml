name: Privileged e2e (body)

# Reusable body for one architecture, called by privileged-e2e.yml (which owns
# the enable/disable variables and the fork guard). Not triggered directly.
#
# The runner must be able to run as root: the harness chroots, setuids, writes
# cgroups and mknod()s /dev/kvm. See docs/TESTING.md §"Privileged runners" for
# the host prerequisites and the registration commands.

on:
  workflow_call:
    inputs:
      label:
        description: "self-hosted runner label to target"
        required: true
        type: string
      arch:
        description: "architecture, used for artefact names"
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ inputs.arch }})
    runs-on: [self-hosted, "${{ inputs.label }}"]
    env:
      # Build the guest image from this checkout instead of using the operator's
      # /opt/sandbox-assets/rootfs.ext4, so guest-side changes (scripts/
      # sandbox-agent.c, /init) are actually exercised.
      SANDBOX_ROOTFS: ${{ github.workspace }}/guest/rootfs.ext4
      # The guest kernel is fetched from Firecracker's CI bucket at the version
      # and digests pinned in scripts/fetch-guest-kernel.sh. It used to be
      # whatever the runner had in /opt (4.14), which meant CI tested a kernel
      # nobody ships.
      SANDBOX_KERNEL: ${{ github.workspace }}/guest/vmlinux
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the pinned guest kernel
        run: |
          bash scripts/fetch-guest-kernel.sh --arch "${{ inputs.arch }}" \
               --out "$SANDBOX_KERNEL"

      - name: Build the guest image
        run: |
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ] && SUDO=sudo
          $SUDO env SANDBOX_ROOTFS_OUT="$SANDBOX_ROOTFS" \
                bash scripts/build-custom-rootfs.sh
          ls -l "$SANDBOX_ROOTFS"

      - name: Build the Debian guest image (#32)
        # The busybox image is the cheap fixture; this is what a user boots. It
        # is built here, from this checkout, so the suite below cannot pass on an
        # operator's stale /opt image. debootstrap needs network + root.
        #
        # x86_64 only for now: the platform focus is x86_64 (Discussion #29) and
        # adding debootstrap to the ARM runner is work for the ARM milestone.
        if: ${{ inputs.arch == 'x86_64' }}
        run: |
          set -euo pipefail
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ] && SUDO=sudo
          $SUDO env SANDBOX_ROOTFS_OUT="$PWD/guest/rootfs-debian.ext4" \
                bash scripts/build-debian-rootfs.sh
          ls -l "$PWD/guest/rootfs-debian.ext4"

      - name: Configure
        # The VM tests need a workspace on a filesystem that permits device
        # nodes: the jail mknod()s /dev/kvm and /dev/net/tun, and opening them
        # on a `nodev` mount fails with EACCES. /tmp is nodev on most hosts,
        # /var/tmp usually is not.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DSANDBOX_TEST_TMPDIR="${SANDBOX_TEST_TMPDIR:-/var/tmp}"

      - name: Build
        run: cmake --build build -j

      - name: Unit tests that need no privileges
        run: |
          set -euo pipefail
          # -V so that a SKIP is visible and can be judged. This runner is root
          # with KVM, so the only legitimate skips are environmental: user
          # namespaces blocked (e.g. a container's seccomp profile) and
          # userfaultfd denied. Anything else means a test did not execute.
          ctest --test-dir build -V \
            -E "pool|network|tmpl_setup|vmm|^ipc$|cgroup|jail_sweep" \
            | tee /tmp/ctest-all.log
          if grep -E 'SKIP' /tmp/ctest-all.log \
               | grep -vE 'userns id-mapping|user namespaces are restricted|uffd|userfaultfd'; then
            echo "::error::a test skipped for an unexpected reason"
            exit 1
          fi

      # The whole point of a self-hosted runner: the tests that cannot run on
      # hosted CI. They need root, /dev/kvm, Firecracker and the guest assets.
      #
      # Run the suite as root; the tests themselves must NOT call sudo, because
      # sudo resets the environment and would strip the workspace roots ctest
      # passes via its ENVIRONMENT property -- the tests then SKIP (exit 0) and
      # the job goes green having executed nothing. -V is deliberate: this job's
      # value is the evidence in its output.
      - name: Tests that need root, /dev/kvm and guest assets
        run: |
          set -euo pipefail
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ] && SUDO=sudo
          $SUDO ctest --test-dir build -V \
            -R "^(pool|network|network_cleanup|tmpl_setup|vmm|ipc|cgroup|jail_sweep)$" \
            | tee /tmp/privileged-ctest.log

      # A skipped privileged test is a green no-op: it proves nothing. Fail on
      # one so this job can never "pass" without actually executing them.
      - name: No privileged test may skip
        run: |
          if grep -nE '\*\*\*Skipped|SKIP \(|\*\*\*Not Run' /tmp/privileged-ctest.log; then
            echo "::error::a privileged test skipped or did not run"; exit 1
          fi
          echo "all privileged tests executed"

      # A run against the operator's older /opt guest image is indistinguishable
      # from a real one in the results: same tests, same names, green. It happened
      # on the non-root aarch64 runner, where `sudo ctest` reset the environment
      # and dropped SANDBOX_ROOTFS, so the leg exercised a guest built before the
      # code under test. The fixture prints the image it loaded; require it to be
      # the one this job built.
      - name: The guest image and kernel under test are the ones just built
        run: |
          set -euo pipefail
          grep -F "rootfs=$SANDBOX_ROOTFS" /tmp/privileged-ctest.log \
            || { echo "::error::the suite did not use SANDBOX_ROOTFS=$SANDBOX_ROOTFS"; exit 1; }
          grep -F "kernel=$SANDBOX_KERNEL" /tmp/privileged-ctest.log \
            || { echo "::error::the suite did not use SANDBOX_KERNEL=$SANDBOX_KERNEL"; exit 1; }
          echo "guest image under test: $SANDBOX_ROOTFS"
          echo "guest kernel under test: $SANDBOX_KERNEL"

      # The runner may or may not be the root user; use sudo only when needed.
      # `sudo` resets the environment, so the asset overrides have to be handed
      # to it explicitly or the harness silently falls back to /opt.
      # Same suite, real userland. dpkg/apt/python exist here and not in the
      # fixture, and the guest is four times larger, so this is also the check
      # that boot/restore timings hold for an image someone would actually ship.
      - name: Privileged suite against the Debian guest (#32)
        if: ${{ inputs.arch == 'x86_64' }}
        run: |
          set -euo pipefail
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ] && SUDO=sudo
          DEB_IMG="$PWD/guest/rootfs-debian.ext4"
          # SANDBOX_E2E_INTERNET=1 adds the real thing to the guest-network test
          # (#26): a package index on the real internet, through the real broker,
          # over real TLS, for a sandbox whose policy names only that index.
          $SUDO env SANDBOX_ROOTFS="$DEB_IMG" SANDBOX_E2E_INTERNET=1 ctest --test-dir build -V \
            -R "^(pool|tmpl_setup|vmm|ipc)$" \
            | tee /tmp/privileged-ctest-debian.log
          if grep -nE '\*\*\*Skipped|SKIP \(|\*\*\*Not Run' /tmp/privileged-ctest-debian.log; then
            echo "::error::a privileged test skipped against the Debian image"; exit 1
          fi
          # The fixture image has no curl, so the guest-network test may skip there.
          # On the Debian image it must run, or "a guest reaches only its allow-list"
          # is unproven: demand the lines that show it did.
          if grep -n 'SKIP guest network' /tmp/privileged-ctest-debian.log; then
            echo "::error::the guest-network test skipped on the Debian image"; exit 1
          fi
          for want in 'net: allow-listed host reached through the broker' \
                      'net: CONNECT tunnel works end to end' \
                      'net: a host outside the policy -> 403' \
                      'net: no direct route to anything but the broker' \
                      'net: pypi.org simple index through the broker'; do
            grep -F "$want" /tmp/privileged-ctest-debian.log | grep -q PASS \
              || { echo "::error::guest-network check did not pass: $want"; exit 1; }
          done
          grep -F "rootfs=$DEB_IMG" /tmp/privileged-ctest-debian.log \
            || { echo "::error::the Debian run did not use $DEB_IMG"; exit 1; }
          grep -F "kernel=$SANDBOX_KERNEL" /tmp/privileged-ctest-debian.log \
            || { echo "::error::the Debian run did not use $SANDBOX_KERNEL"; exit 1; }

      - name: Template pipeline from a checked-in spec (#25)
        # The pipeline an operator drives: spec -> image -> cold boot -> snapshot ->
        # content-addressed store. Asserted, not just run:
        #   * the image is a function of the spec (two builds, same bytes);
        #   * the published template verifies, is a store link, and records the
        #     spec and kernel it came from;
        #   * a second build is published beside it, rollback returns to the
        #     first and back, and GC keeps the current one and drops the other.
        # (The restore path itself is covered by the suites above, which build
        # their template through the same store.)
        if: ${{ inputs.arch == 'x86_64' }}
        run: |
          set -euo pipefail
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ] && SUDO=sudo
          ROOT="$(mktemp -d /var/tmp/tpl-e2e.XXXXXX)"
          cleanup() { $SUDO chmod -R u+w "$ROOT" 2>/dev/null || true; $SUDO rm -rf "$ROOT"; }
          trap cleanup EXIT
          export SOURCE_DATE_EPOCH=1700000000
          CLI="$PWD/build/sandbox-cli"

          for n in a b; do
            $SUDO env SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" bash scripts/build-template.sh \
                templates/python-agent --rootfs-only --cache-dir "$ROOT/cache" \
                --keep-rootfs "$ROOT/$n.ext4" | tee "$ROOT/$n.out"
          done
          A="$(sed -n 's/^rootfs_sha256=//p' "$ROOT/a.out")"; B="$(sed -n 's/^rootfs_sha256=//p' "$ROOT/b.out")"
          [ -n "$A" ] || { echo "::error::no image digest was printed"; exit 1; }
          if [ "$A" != "$B" ]; then
            echo "::error::two builds of the same spec produced different images ($A vs $B)"
            mkdir -p "$ROOT/ma" "$ROOT/mb"
            $SUDO mount -o loop,ro "$ROOT/a.ext4" "$ROOT/ma"; $SUDO mount -o loop,ro "$ROOT/b.ext4" "$ROOT/mb"
            $SUDO diff -rq "$ROOT/ma" "$ROOT/mb" | head -40 || true
            for m in ma mb; do $SUDO sh -c "cd $ROOT/$m && find . -xdev -printf '%p %m %U %G %s %T@ %i\n' | sort" > "$ROOT/$m.meta"; done
            diff "$ROOT/ma.meta" "$ROOT/mb.meta" | head -40 || true
            $SUDO umount "$ROOT/ma" "$ROOT/mb"
            exit 1
          fi
          echo "image reproducible: $A"

          SNAP="$ROOT/snap"
          tenv() { $SUDO env SANDBOX_SNAPSHOT_ROOT="$SNAP" SANDBOX_JAIL_ROOT="$ROOT/jails" \
                       SANDBOX_WORKSPACE_ROOT="$ROOT/ws" SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" "$@"; }
          build() { tenv bash scripts/build-template.sh templates/python-agent --kernel "$SANDBOX_KERNEL" \
                        --cli "$CLI" --cache-dir "$ROOT/cache" --keep-rootfs "$ROOT/t.ext4" | tee "$ROOT/build.out" >&2
                    sed -n 's/.*"event":"built".*"digest":"\([0-9a-f]\{64\}\)".*/\1/p' "$ROOT/build.out" | tail -1; }
          D1="$(build | tail -1)"
          [ -n "$D1" ] || { echo "::error::the build printed no digest"; exit 1; }
          [ -L "$SNAP/python-agent" ] || { echo "::error::the published name is not a store link"; exit 1; }
          tenv "$CLI" template verify --name python-agent
          tenv "$CLI" template verify --name "$D1"
          tenv "$CLI" template list | tee "$ROOT/list.out"
          grep -F "\"digest\":\"$D1\"" "$ROOT/list.out" >/dev/null || { echo "::error::list does not show $D1"; exit 1; }
          META="$SNAP/.store/$D1/template.json"
          SPEC_SHA="$(bash scripts/build-template.sh templates/python-agent --check | sed -n 's/^spec_sha256=//p')"
          KSHA="$(sha256sum "$SANDBOX_KERNEL" | cut -d' ' -f1)"
          grep -F "\"spec_sha256\": \"$SPEC_SHA\"" "$META" >/dev/null || { echo "::error::template.json lacks the spec digest"; cat "$META"; exit 1; }
          grep -F "\"kernel_sha256\": \"$KSHA\"" "$META" >/dev/null || { echo "::error::template.json lacks the kernel digest"; cat "$META"; exit 1; }
          cat "$META"

          D2="$(build | tail -1)"
          [ -n "$D2" ] || { echo "::error::the second build printed no digest"; exit 1; }
          if [ "$D1" = "$D2" ]; then
            echo "the two snapshots were byte-identical ($D1): publish deduplicated"
          else
            echo "snapshots differ run to run ($D1 vs $D2): expected, memory is not bit-reproducible"
            tenv "$CLI" template rollback --name python-agent | tee "$ROOT/rb.out"
            grep -F "$D1" "$ROOT/rb.out" >/dev/null || { echo "::error::rollback did not return to $D1"; exit 1; }
            [ "$(basename "$(readlink "$SNAP/python-agent")")" = "$D1" ] || { echo "::error::the name does not point at $D1"; exit 1; }
            tenv "$CLI" template rollback --name python-agent | grep -F "$D2" >/dev/null \
                || { echo "::error::second rollback did not return to $D2"; exit 1; }
            tenv "$CLI" template gc --keep 1 --min-age 0 | tee "$ROOT/gc-dry.out"
            [ -d "$SNAP/.store/$D1" ] || { echo "::error::a dry run removed $D1"; exit 1; }
            tenv "$CLI" template gc --keep 1 --min-age 0 --apply | tee "$ROOT/gc.out"
            [ ! -e "$SNAP/.store/$D1" ] || { echo "::error::gc kept the unreferenced $D1"; exit 1; }
            [ -d "$SNAP/.store/$D2" ] || { echo "::error::gc removed the current template"; exit 1; }
            tenv "$CLI" template verify --name python-agent
          fi
          echo "template pipeline OK"

      - name: e2e smoke (root)
        run: |
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ] && SUDO=sudo
          $SUDO env SANDBOX_ROOTFS="${SANDBOX_ROOTFS:-}" SANDBOX_KERNEL="${SANDBOX_KERNEL:-}" \
                bash tests/e2e/smoke.sh

      - name: HTTP control-plane API (root, #27)
        # sandbox-api in front of the real daemon: create, exec, files both ways,
        # SSE, idempotency, principal isolation, idle VM reclaim with the workspace
        # intact, delete + re-create by key. Prints the HTTP create latency.
        if: ${{ inputs.arch == 'x86_64' }}
        run: |
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ] && SUDO=sudo
          $SUDO env SANDBOX_ROOTFS="${SANDBOX_ROOTFS:-}" SANDBOX_KERNEL="${SANDBOX_KERNEL:-}" \
                bash tests/e2e/http_api.sh 2>&1 | tee http_api.log
          grep -q 'ALL PASSED' http_api.log
          for p in 'VM is reclaimed; the session stays +PASS' 'workspace is intact +PASS' 'files from before are still there +PASS' 'another principal cannot see the session +PASS'; do
            grep -Eq "$p" http_api.log || { echo "missing PASS line: $p"; exit 1; }
          done

      - name: Latency assertions (root)
        run: |
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ] && SUDO=sudo
          $SUDO env SANDBOX_ROOTFS="${SANDBOX_ROOTFS:-}" SANDBOX_KERNEL="${SANDBOX_KERNEL:-}" \
                bash tests/e2e/latency.sh

      - name: Upload daemon logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-logs-${{ inputs.arch }}
          path: /tmp/serial-last-*.log
          if-no-files-found: ignore
          retention-days: 7
