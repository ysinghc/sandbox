name: Privileged e2e

# Runs the tests that need real root, /dev/kvm, /dev/net/tun, nftables,
# Firecracker and the guest assets. None of that exists on GitHub-hosted
# runners, so these jobs need SELF-HOSTED runners.
#
# Inert until a repository variable enables it:
#
#     gh variable set PRIVILEGED_RUNNERS --body true
#
# Until then every job is skipped rather than queued, so pull requests are
# unaffected.
#
# There are two variables, not one, because a job whose runner label nobody
# serves does not fail fast: it queues for ~24h and is then cancelled, which
# looks exactly like a broken workflow. So the aarch64 leg is opt-in:
#
#     gh variable set PRIVILEGED_ARM --body true   # only once an ARM runner exists
#
# The per-runner work lives in privileged-e2e-run.yml so both legs share it.
# Note why these are two jobs rather than two matrix rows: `matrix` is NOT an
# available context in `jobs.<job_id>.if` (only github, needs, vars, inputs) —
# referencing it there makes the whole workflow file invalid.
#
# Security: the runner executes code as root. A pull request from a FORK must
# therefore never reach it, hence the head-repo check below; same-repo PRs are
# the owner's own branches.

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  x86_64:
    name: e2e (x86_64)
    if: >-
      vars.PRIVILEGED_RUNNERS == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/privileged-e2e-run.yml
    with:
      label: sandbox-x86
      arch: x86_64

  aarch64:
    name: e2e (aarch64)
    if: >-
      vars.PRIVILEGED_RUNNERS == 'true' && vars.PRIVILEGED_ARM == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/privileged-e2e-run.yml
    with:
      label: sandbox-arm64
      arch: aarch64
