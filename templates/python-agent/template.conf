#
# A template spec (#25). One directory per template under templates/; build it with
#   sudo scripts/build-template.sh templates/python-agent
# Plain `key=value` lines, parsed as data (never sourced); unknown keys are an error.

description=Debian with python3, pip, venv and git, for agents that write and run Python
base=debian

# Debian suite and the packages added to the base image (comma separated).
suite=bookworm
packages=python3-pip,python3-venv,git

# Optional: fetch packages from a fixed point in time instead of the live archive,
# so the same spec yields the same image next month. A snapshot.debian.org
# timestamp, e.g. 20261001T000000Z. Unset = the live mirror (not reproducible
# across days).
#snapshot=20261001T000000Z

# Optional script (relative to this directory) run as root inside the new image
# after the packages are installed.
provision=provision.sh

# The VM the template is captured from; sessions restored from it inherit these.
memory_mib=256
vcpus=1
# Size of the persistent /workspace volume every session of this template gets.
workspace_size_mb=512
