# #9: the unprivileged daemon identity. sandbox-privileged resolves this name
# at startup and serves exactly this uid; the daemon's primary group owns the
# 0770 jails together with the jailed uid.
u sandboxd - "Sandbox engine daemon" /var/lib/sandbox-engine /usr/sbin/nologin
