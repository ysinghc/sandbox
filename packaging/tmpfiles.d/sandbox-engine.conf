# #9: engine state, by writer. The snapshot store is operator-written and
# daemon-read (world-readable files); workspaces belong to the daemon
# (session volumes + ephemeral clones); jails belong to the helper with
# group access for the daemon.
d /var/lib/sandbox-engine 0755 root root -
d /var/lib/sandbox-engine/snapshots 0755 root root -
d /var/lib/sandbox-engine/workspaces 0755 sandboxd sandboxd -
d /var/lib/sandbox-engine/jail 0755 root root -
