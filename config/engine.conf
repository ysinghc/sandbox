# sandboxd configuration.
#
# Flat "key = value" format. [sections] are cosmetic: the parser ignores
# section headers and keys are matched by name, so keep key names unique.
# Precedence: CLI flags > environment (SANDBOX_*) > this file > built-in
# defaults.

[daemon]
socket_path = /var/run/sandbox-engine/engine.sock
broker_control_socket = /var/run/sandbox-engine/broker-control.sock
template = python-agent

# Comma-separated upstream host allowlist copied into every session token.
# Empty denies all upstreams.
allowed_services =

# Peer uid allowlist for the engine socket (SO_PEERCRED). Empty accepts any
# uid in the socket's group; 0 = root only. Add the service uids that connect.
allowed_uids = 0

# Unprivileged uid/gid Firecracker runs as inside the jail.
jailer_uid = 65534
jailer_gid = 65534

[pool]
target_size = 5
max_queue_depth = 50
pool_wait_timeout_ms = 500

[paths]
jail_root = /var/lib/sandbox-engine/jail
snapshot_root = /var/lib/sandbox-engine/snapshots

[metrics]
metrics_port = 9180
metrics_bind = 127.0.0.1
