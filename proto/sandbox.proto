syntax = "proto3";
package sandbox;

// Client → Daemon
message ClientMessage {
  // #12: client-supplied correlation id, echoed verbatim on the response.
  //
  // Non-zero: the client may have several requests in flight on one connection
  // (including several Creates) and match replies by this id; the daemon does
  // not promise an answer order. Zero: legacy client — the daemon keeps that
  // session's replies in request order and runs one Create at a time, because
  // such a client identifies replies only by arrival order.
  uint64 request_id = 100;
  oneof payload {
    CreateRequest  create  = 1;
    DestroyRequest destroy = 2;
    PauseRequest   pause   = 3;
    ResumeRequest  resume  = 4;
    InspectRequest inspect = 5;
    RenewRequest   renew   = 6;
  }
}

// #23/D5: extend a session volume's deadline. Keyed by the session key, not by
// sandbox id: the volume outlives every VM, so the caller that wants to keep it
// may not have a running sandbox to name.
message RenewRequest {
  string session_key = 1;
  // Seconds to add, counted from now. 0 = the platform default (7 days).
  // Clamped so the session never exceeds the platform maximum (30 days by
  // default); it is never shortened.
  uint32 extra_seconds = 2;
}

message CreateRequest {
  uint64 memory_mib = 1;
  uint32 vcpu_count = 2;
  string template_name = 3;
  repeated string env_vars = 4;  // "KEY=VALUE"
  uint32 pool_wait_ms = 5;
  // #23: persistent session workspace. Empty = ephemeral (default).
  string session_key = 6;
  uint32 ttl_seconds = 7;  // 0 = platform default
}

message DestroyRequest {
  uint32 sandbox_id = 1;
}

message PauseRequest {
  uint32 sandbox_id = 1;
}

message ResumeRequest {
  uint32 sandbox_id = 1;
}

message InspectRequest {
  uint32 sandbox_id = 1;
}

// Daemon → Client
message ServerMessage {
  // Echo of ClientMessage.request_id (0 if the request had none).
  uint64 request_id = 100;
  oneof payload {
    CreateResponse  create  = 1;
    DestroyResponse destroy = 2;
    ErrorResponse   error   = 3;
    InspectResponse inspect = 4;
    PauseResponse   pause   = 5;
    ResumeResponse  resume  = 6;
    RenewResponse   renew   = 7;
  }
}

message RenewResponse {
  uint64 expires_at = 1;  // unix seconds; the deadline after this call
}

message CreateResponse {
  uint32 sandbox_id = 1;
  string session_token = 2;  // Hex-encoded 256-bit token
}

message DestroyResponse {
  uint32 sandbox_id = 1;
}

message PauseResponse {
  uint32 sandbox_id = 1;
}

message ResumeResponse {
  uint32 sandbox_id = 1;
}

message ErrorResponse {
  int32 error_code = 1;       // Maps to sandbox_error_t
  string error_message = 2;
}

message InspectResponse {
  uint32 sandbox_id = 1;
  bool is_running = 2;
  uint64 uptime_ms = 3;
  uint64 memory_rss_mib = 4;
  uint32 page_faults = 5;
}
