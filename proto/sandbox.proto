syntax = "proto3";
package sandbox;

// Client → Daemon
message ClientMessage {
  // #12: client-supplied correlation id, echoed verbatim on the response.
  //
  // Non-zero: the client may have several requests in flight on one connection
  // (including several Creates) and match replies by this id; the daemon does
  // not promise an answer order. Zero: legacy client — the daemon keeps that
  // session's replies in request order and runs one Create at a time, because
  // such a client identifies replies only by arrival order.
  uint64 request_id = 100;
  oneof payload {
    CreateRequest  create  = 1;
    DestroyRequest destroy = 2;
    PauseRequest   pause   = 3;
    ResumeRequest  resume  = 4;
    InspectRequest inspect = 5;
    RenewRequest   renew   = 6;
    GuestRequest   guest   = 7;
  }
}

// #23/D5: extend a session volume's deadline. Keyed by the session key, not by
// sandbox id: the volume outlives every VM, so the caller that wants to keep it
// may not have a running sandbox to name.
message RenewRequest {
  string session_key = 1;
  // Seconds to add, counted from now. 0 = the platform default (7 days).
  // Clamped so the session never exceeds the platform maximum (30 days by
  // default); it is never shortened.
  uint32 extra_seconds = 2;
}

message CreateRequest {
  uint64 memory_mib = 1;
  uint32 vcpu_count = 2;
  string template_name = 3;
  repeated string env_vars = 4;  // "KEY=VALUE"
  uint32 pool_wait_ms = 5;
  // #23: persistent session workspace. Empty = ephemeral (default).
  string session_key = 6;
  uint32 ttl_seconds = 7;  // 0 = platform default
  // #26: per-session egress policy. Empty list + !deny_all = the daemon-wide
  // policy. Entries: "host", "host:port", "*.suffix[:port]".
  repeated string egress_allow = 8;
  bool egress_deny_all = 9;
}

message DestroyRequest {
  uint32 sandbox_id = 1;
}

message PauseRequest {
  uint32 sandbox_id = 1;
}

message ResumeRequest {
  uint32 sandbox_id = 1;
}

message InspectRequest {
  uint32 sandbox_id = 1;
}

// Daemon → Client
message ServerMessage {
  // Echo of ClientMessage.request_id (0 if the request had none).
  uint64 request_id = 100;
  oneof payload {
    CreateResponse  create  = 1;
    DestroyResponse destroy = 2;
    ErrorResponse   error   = 3;
    InspectResponse inspect = 4;
    PauseResponse   pause   = 5;
    ResumeResponse  resume  = 6;
    RenewResponse   renew   = 7;
    GuestResponse   guest   = 8;
  }
}

message RenewResponse {
  uint64 expires_at = 1;  // unix seconds; the deadline after this call
}

message CreateResponse {
  uint32 sandbox_id = 1;
  string session_token = 2;  // Hex-encoded 256-bit token
}

message DestroyResponse {
  uint32 sandbox_id = 1;
}

message PauseResponse {
  uint32 sandbox_id = 1;
}

message ResumeResponse {
  uint32 sandbox_id = 1;
}

message ErrorResponse {
  int32 error_code = 1;       // Maps to sandbox_error_t
  string error_message = 2;
}

message InspectResponse {
  uint32 sandbox_id = 1;
  bool is_running = 2;
  uint64 uptime_ms = 3;
  uint64 memory_rss_mib = 4;
  uint32 page_faults = 5;
}

// #24: operations on a running sandbox's guest agent. One message pair serves all
// seven ops so the daemon has one dispatch path; `op` selects the fields that
// matter. Requires a non-zero request_id: these run concurrently on a worker
// pool and can take minutes, so a reply can never be matched by arrival order.
//
// Everything here must fit one IPC frame (64 KiB). Large inputs and outputs are
// therefore chunked by the caller (libsandbox does it for read/write), and exec
// output is the *head* of each stream with the true byte counts alongside.
message GuestRequest {
  uint32 sandbox_id = 1;
  uint32 op = 2;           // 1 exec, 2 read_file, 3 write_file, 4 list_dir,
                           // 5 stat, 6 mkdir, 7 remove
  string path = 3;         // the path; for exec, the working directory
  repeated string argv = 4;
  repeated string env = 5;  // exec, "KEY=VALUE"
  bytes data = 6;          // exec: stdin; write_file: the chunk
  uint32 timeout_ms = 7;   // exec; 0 = the agent's default
  uint32 max_output = 8;   // exec: agent-side cap on stdout+stderr, 0 = default
  uint64 offset = 9;       // read_file
  uint32 max_bytes = 10;   // read_file
  uint32 mode = 11;        // write_file, mkdir
  bool shell = 12;         // exec: argv[0] is a script for /bin/sh -c
  bool append = 13;        // write_file
  bool exclusive = 14;     // write_file: fail if it exists
  bool parents = 15;       // write_file, mkdir
  bool recursive = 16;     // remove
}

message DirEntry {
  string name = 1;
  uint32 type = 2;         // 0 other, 1 file, 2 dir, 3 symlink
  uint64 size = 3;
  int64 mtime = 4;
}

message GuestResponse {
  uint32 sandbox_id = 1;
  int32 exit_code = 2;     // exec; -1 when killed by a signal
  int32 term_signal = 3;
  bool timed_out = 4;
  bool output_truncated = 5;  // the agent's max_output cap killed the command
  bytes out = 6;           // exec stdout head; read_file data
  bytes err = 7;           // exec stderr head
  uint64 out_total = 8;    // exec: bytes the command wrote, kept or not
  uint64 err_total = 9;
  bool truncated = 10;     // read_file: more follows; list_dir: listing cut
  uint64 size = 11;        // stat: size in bytes
  repeated DirEntry entries = 12;
  uint32 type = 13;        // stat
  uint32 mode = 14;        // stat
  int64 mtime = 15;        // stat
}
