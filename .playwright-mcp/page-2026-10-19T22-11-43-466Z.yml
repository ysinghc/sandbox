    - region [ref=f1e109]:
      - generic [ref=f1e110]:
        - heading "Boot once. Restore on demand." [level=2] [ref=f1e111]
        - generic [ref=f1e112]:
          - paragraph [ref=f1e113]: Sandbox Engine is a daemon plus C and C++ client libraries. It keeps a bounded pool of pre-booted Firecracker microVMs, restores one when you ask, and returns a handle you can inspect, pause, resume, and destroy.
          - paragraph [ref=f1e114]: "It is built for a single trusted operator running untrusted workloads on one host: a lab machine, a CI runner, an appliance. Each guest is jailed with chroot, seccomp, an unprivileged uid, and its own cgroup. Credentials stay on the host and are injected by a broker, so guests never hold them."
          - paragraph [ref=f1e115]:
            - text: It is not a multi-tenant isolation boundary. The design and trust model are written down in
            - link "Architecture" [ref=f1e116] [cursor=pointer]:
              - /url: https://github.com/ysinghc/sandbox/blob/master/docs/ARCHITECTURE.md
            - text: and the
            - link "Threat model" [ref=f1e117] [cursor=pointer]:
              - /url: https://github.com/ysinghc/sandbox/blob/master/docs/THREAT_MODEL.md
            - text: .
    - region [ref=f1e118]:
      - generic [ref=f1e119]:
        - generic [ref=f1e120]:
          - heading "The useful parts, kept sharp." [level=2] [ref=f1e121]
          - paragraph [ref=f1e122]: No orchestrator, no control plane, no queue you have to operate. One daemon on one host.
        - generic [ref=f1e123]:
          - article [ref=f1e124]:
            - heading "Restore, not boot" [level=3] [ref=f1e125]
            - paragraph [ref=f1e126]: Snapshots plus userfaultfd demand paging mean only the pages a guest actually touches are loaded. Restored guests start at host time, and the manifest binds memory, vmstate, and rootfs by SHA-256.
          - article [ref=f1e127]:
            - heading "Jailed before it runs" [level=3] [ref=f1e128]
            - paragraph [ref=f1e129]: Every Firecracker process is chrooted, runs as an unprivileged uid, loads a seccomp allowlist, and starts with no_new_privs set. The guest control channel accepts only the host's vsock CID.
          - article [ref=f1e130]:
            - heading "Limits that hold" [level=3] [ref=f1e131]
            - paragraph [ref=f1e132]: Each VM gets its own cgroup v2 memory and CPU limits. A runaway guest cannot take the host or the daemon down with it.
          - article [ref=f1e133]:
            - heading "Secrets stay on the host" [level=3] [ref=f1e134]
            - paragraph [ref=f1e135]: Guests call an allow-listed upstream through a credential broker. The broker validates a per-session token and injects the real secret host-side.
    - region [ref=f1e136]:
      - generic [ref=f1e137]:
        - generic [ref=f1e138]:
          - heading "From request to running guest." [level=2] [ref=f1e139]
          - paragraph [ref=f1e140]: A create normally resumes memory and faults in the template, then hands the VM to the caller.
        - list [ref=f1e141]:
          - listitem [ref=f1e142]:
            - generic [ref=f1e143]: "01"
            - heading "Restore" [level=3] [ref=f1e144]
            - paragraph [ref=f1e145]: The pool manager takes a restored template, or restores one from the snapshot store. The manifest binds memory, vmstate, and rootfs; a uffd handler pages memory in on demand.
          - listitem [ref=f1e146]:
            - generic [ref=f1e147]: "02"
            - heading "Contain" [level=3] [ref=f1e148]
            - paragraph [ref=f1e149]: The VMM manager injects the environment, places the process in a cgroup, and the jailer applies chroot, uid drop, and seccomp.
          - listitem [ref=f1e150]:
            - generic [ref=f1e151]: "03"
            - heading "Hand off" [level=3] [ref=f1e152]
            - paragraph [ref=f1e153]: The daemon confirms the guest is ready and returns a sandbox handle over the local protobuf API. The guest clock starts at host time, not the template's capture time.
    - region [ref=f1e154]:
      - generic [ref=f1e155]:
        - generic [ref=f1e156]:
          - heading "Build it once. Ask for sandboxes." [level=2] [ref=f1e157]
          - generic [ref=f1e158]:
            - paragraph [ref=f1e159]: "The API is small and explicit: initialise, create, inspect, destroy. The daemon, CLI, and broker are separate binaries with one config file between them."
            - paragraph [ref=f1e160]:
              - text: Prefer a release?
              - link "The install script" [ref=f1e161] [cursor=pointer]:
