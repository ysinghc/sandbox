              - text: selects your architecture and checks the SHA-256 before writing anything.
          - link "Read the C and C++ API" [ref=f1e162] [cursor=pointer]:
            - /url: https://github.com/ysinghc/sandbox/blob/master/docs/API.md
            - text: Read the C and C++ API
            - generic [aria-hidden] [ref=f1e163]: →
          - paragraph [ref=f1e164]: Needs Linux with KVM and userfaultfd. The daemon runs as root because it creates taps, device nodes, cgroups, and jails.
